<!-- Music mute / unmute toggle (top-right, available throughout the landing flow) -->
<button
  type="button"
  class="landing-music-toggle"
  (click)="toggleMusic()"
  [attr.aria-label]="audioService.muted ? 'Unmute background music' : 'Mute background music'"
  title="Toggle music"
>
  {{ audioService.muted ? '🔇' : '🔊' }}
</button>

<!-- Landing page -->
<div class="landing-page" *ngIf="onLandingPage" @fade>
  <div class="hero">
    <div class="hero-inner">
      <h1>Welcome to Escape Room</h1>
      <p class="lead">A text based mystery game.</p>
      <div class="hero-actions">
        <button
          type="button"
          class="btn btn-primary btn-lg px-4 gap-3"
          (click)="startGame()"
        >
          Start the Game
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Intro typewriter lines -->
<div class="game-screen" *ngIf="!onLandingPage && !gameTextDone" @fade>
  <p class="game-text">{{ dialog }}</p>
</div>

<!-- After intro lines end: glowing Step into the Wild button -->
<div class="game-screen step-screen" *ngIf="gameTextDone">
  <button
    *ngIf="showStepButton"
    type="button"
    class="step-btn"
    (click)="stepIntoTheWild()"
    @riseIn
  >
    [ Step into the Wild &amp; Enter ]
  </button>
</div>

<!-- 500ms fade-to-white transition overlay (covers route change) -->
<div class="fade-overlay" [class.active]="fadingOut"></div>
