<div class="victory-screen">
  <!-- Confetti -->
  <div class="confetti-container">
    <div
      *ngFor="let c of confetti"
      class="confetti-piece"
      [style.left]="c.left"
      [style.animation-delay]="c.delay"
      [style.animation-duration]="c.duration"
      [style.background]="c.color"
    ></div>
  </div>

  <h1>🎉 YOU ESCAPED! 🎉</h1>

  <div class="poem">
    <p *ngFor="let line of displayedLines" @fadeIn class="poem-line">{{ line }}</p>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-value">⏱ {{ elapsedTime }}</span>
      <span class="stat-label">Time</span>
    </div>
    <div class="stat">
      <span class="stat-value">❌ {{ wrongAttempts }}</span>
      <span class="stat-label">Wrong Attempts</span>
    </div>
  </div>

  <button class="play-again-btn" (click)="playAgain()">🔁 Play Again</button>
</div>
